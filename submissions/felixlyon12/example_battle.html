<style>

  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0%, #2a1748, var(--bg) 70%); color:var(--fg);
         font-family: "Arial Black", Impact, system-ui, sans-serif; min-height:100vh; overflow-x:hidden; }
  header { text-align:center; padding:24px 16px 8px; }
  h1 { margin:0; font-size:clamp(40px,9vw,88px); letter-spacing:-2px; color:var(--hot);
       text-shadow:4px 4px 0 var(--pink), 8px 8px 0 #000; transform:rotate(-2deg); }
  #mc { font-size:22px; color:var(--cyan); margin-top:10px; min-height:28px; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0; font-family:system-ui,sans-serif; }
  .stat { background:#ffffff12; border:1px solid #ffffff22; padding:6px 12px; border-radius:999px; font-size:14px; }
  .stat b { color:var(--hot); }
  button { font:inherit; font-size:22px; padding:14px 34px; border:0; border-radius:14px; cursor:pointer;
           background:var(--pink); color:#fff; box-shadow:0 6px 0 #8a1458; margin:6px; }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #8a1458; }
  #speakers { display:flex; justify-content:center; gap:40px; margin:10px 0; }
  .spk { width:70px; height:70px; border-radius:50%; background:radial-gradient(circle,#333 30%,#111 31%,#222 60%,#000 61%);
         border:4px solid #444; transition:transform .06s; }
  .spk.thump { transform:scale(1.18); border-color:var(--hot); }
  #lyrics { max-width:900px; margin:0 auto; padding:10px 16px 60px; }
  .line { font-size:clamp(18px,3.4vw,30px); padding:6px 10px; border-radius:8px; color:var(--dim);
          transition:all .15s; }
  .line .w { transition:color .05s, text-shadow .05s; }
  .line .rhyme, .line .end { color:var(--fam); opacity:.75; }
  .line .end { text-decoration:underline; text-underline-offset:5px; }
  .line .adlib { font-style:italic; opacity:.6; }
  .line.on { color:#cfc6ea; background:#ffffff10; transform:scale(1.03); }
  .line.on .rhyme, .line.on .end { opacity:1; }
  .line .w.hit { color:#fff; text-shadow:0 0 14px #fff; }
  .line .rhyme.hit, .line .end.hit { color:var(--fam); text-shadow:0 0 22px var(--fam); }
  .grid { display:flex; gap:3px; margin:2px 10px 0; }
  .grid i { width:10px; height:4px; border-radius:2px; background:#ffffff18; }
  .grid i.q { background:#ffffff35; } .grid i.hit { background:var(--hot); }
  .line.hook { font-style:italic; }
  .sec { color:var(--pink); font-size:14px; letter-spacing:3px; margin:18px 10px 4px; font-family:system-ui,sans-serif; }
  .winner { text-align:center; font-size:40px; color:var(--hot); margin:20px; }
  #source { max-width:900px; margin:0 auto 40px; padding:0 16px; font-family:ui-monospace,monospace; font-size:12px;
            color:var(--dim); word-break:break-word; }
</style>

const lyrics = document.getElementById("lyrics");
const lineEls = [];   // [verseIndex][lineIndex]
const famHue = {};
VERSES.forEach((v, vi) => {
  const sec = document.createElement("div");
  sec.className = "sec";
  sec.textContent = `🎤 ${v.mc} · ${v.bpm} BPM · ${v.mood}`;
  lyrics.appendChild(sec);
  lineEls[vi] = [];
  v.lines.forEach((l, li) => {
    if (li === v.bars || li === v.bars + 2) {
      const h = document.createElement("div"); h.className = "sec"; h.textContent = "HOOK"; lyrics.appendChild(h);
    }
    const d = document.createElement("div");
    d.className = "line" + (l.family === "hook" ? " hook" : "");
    const hue = l.family === "hook" ? 48 : (famHue[l.family] ??= (Object.keys(famHue).length * 67 + 300) % 360);
    d.style.setProperty("--fam", `hsl(${hue} 95% 65%)`);
    let s = 0;
    l.tokens.forEach(t => {
      const sp = document.createElement("span");
      sp.className = "w " + t.kind;
      sp.textContent = t.t.trimEnd();
      sp.dataset.step = v.flow[s];        // the 16th note this word starts on
      s += t.syl;
      d.appendChild(sp);
      const gap = t.t.slice(t.t.trimEnd().length) || (t.kind === "adlib" ? " " : "");
      if (gap) d.appendChild(document.createTextNode(gap));
    });
    const g = document.createElement("div"); g.className = "grid";
    for (let k = 0; k < 16; k++) { const c = document.createElement("i"); if (k % 4 === 0) c.className = "q"; g.appendChild(c); }
    d.appendChild(g);
    lyrics.appendChild(d);
    lineEls[vi].push(d);
  });
  if (v.winner) {
    const w = document.createElement("div"); w.className = "winner"; w.textContent = `🏆 ${v.mc} WINS`;
    lyrics.appendChild(w);
  }
});
document.getElementById("source").textContent =

function showStats(v) {
  document.getElementById("mc").textContent = `now on the mic: ${v.mc}`;
  document.getElementById("stats").innerHTML =
    `<span class="stat">whack() gave <b>${v.count}</b> words</span>` +
    `<span class="stat"><b>${v.bars}</b> bars</span><span class="stat"><b>${v.bpm}</b> BPM</span>` +
    `<span class="stat">mood <b>${v.mood}</b></span>` +
    `<span class="stat">hook <b>${v.hook.toUpperCase()}</b> ×${v.hook_count}</span>`;
}
showStats(VERSES[0]);

// ---- the beat: a tiny synth drum machine ----
let ctx;
function kick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.3);
}
function noise(t, len, freq, vol) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = buf; f.type = "highpass"; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  s.connect(f).connect(g).connect(ctx.destination); s.start(t);
}
const KICK = [0, 3, 8, 10], SNARE = [4, 12];
function thump() {
  document.querySelectorAll(".spk").forEach(s => { s.classList.add("thump"); setTimeout(() => s.classList.remove("thump"), 90); });
}

// ---- the voice ----
function rap(text, seconds) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  // every line is 12 syllables; a voice at rate 1 says about 4 syllables a second
  u.rate = Math.min(3, Math.max(0.8, 12 / (4 * seconds)));
  u.pitch = 0.8;
  speechSynthesis.speak(u);
}

async function perform() {
  ctx = ctx || new AudioContext();
  await ctx.resume();
  document.getElementById("go").disabled = true;
  for (let vi = 0; vi < VERSES.length; vi++) {
    const v = VERSES[vi];
    showStats(v);
    const step = 60 / v.bpm / 4;                 // a 16th note
    let barSec = step * 16;
    const stepsPerLine = barSec < 2.4 ? 32 : 16; // fast beats get two bars per line
    const total = (v.lines.length + 1) * stepsPerLine; // +1 bar of intro
    let start = ctx.currentTime + 0.1;
    await new Promise(done => {
      let n = 0;
      const tick = () => {
        // schedule 16ths slightly ahead, and fire visuals on time
        const t = start + n * step;
        if (KICK.includes(n % 16)) { kick(t); setTimeout(thump, (t - ctx.currentTime) * 1000); }
        if (SNARE.includes(n % 16)) noise(t, 0.18, 1200, 0.6);
        if (n % 2 === 0) noise(t, 0.04, 7000, 0.25);
        const li = Math.floor(n / stepsPerLine) - 1;
        const scale = stepsPerLine / 16, sub = n % stepsPerLine;
        if (li >= 0 && li < v.lines.length && sub % scale === 0) {
          const el = lineEls[vi][li], st = sub / scale;
          setTimeout(() => {
            el.querySelectorAll(`.w[data-step="${st}"]`).forEach(w => w.classList.add("hit"));
            const cell = el.querySelectorAll(".grid i")[st];
            if (v.flow.includes(st)) cell.classList.add("hit");
          }, Math.max(0, (t - ctx.currentTime) * 1000));
        }
        if (n % stepsPerLine === 0 && li >= 0 && li < v.lines.length) {
          setTimeout(() => {
            lineEls[vi].forEach(e => e.classList.remove("on"));
            const el = lineEls[vi][li];
            el.classList.add("on");
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            rap(v.lines[li].tokens.map(t => t.t).join(" "), stepsPerLine * step * 13 / 16);
          }, Math.max(0, (t - ctx.currentTime) * 1000));
        }
        n++;
        if (n >= total) { setTimeout(done, stepsPerLine * step * 1000); return; }
        setTimeout(tick, Math.max(0, (start + n * step - ctx.currentTime - 0.05) * 1000));
      };
      tick();
    });
    lineEls[vi].forEach(e => e.classList.remove("on"));
  }
  document.querySelectorAll(".hit").forEach(e => e.classList.remove("hit"));
  document.getElementById("go").disabled = false;
  document.getElementById("mc").textContent = "🎤 mic drop. run spit.py again for a new verse.";
}
document.getElementById("go").onclick = perform;
